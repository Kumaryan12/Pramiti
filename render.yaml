services:
  - type: web
    name: pramiti
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pramiti-db
          property: connectionString
      - key: SECURE_COOKIES
        value: "1"
databases:
  - name: pramiti-db
    plan: free
    ipAllowList: []
